name: Build and release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Test and build
        run: |
          cargo test --locked --release --target "$TARGET"
          cargo build --locked --release --target "$TARGET"
      - name: Package binary
        id: package
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir dist
          version="v0.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            version="pr${PR_NUMBER}-${GITHUB_SHA:0:7}"
          fi
          artifact="fnm-shim-${version}-${TARGET}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          archive="$artifact.tar.gz"
          tar -czf "dist/$archive" -C "target/$TARGET/release" fnm-shim -C "$GITHUB_WORKSPACE" LICENSE
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fnm-shim-v0.0.${{ github.run_number }}-*
          path: dist
          merge-multiple: true
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v0.0.${{ github.run_number }}
        working-directory: dist
        run: |
          sha256sum --check *.sha256
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$TAG" *.tar.gz SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" --generate-notes
